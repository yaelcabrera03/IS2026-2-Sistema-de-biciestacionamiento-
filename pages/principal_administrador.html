<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/STYLE.CSS">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Protest+Guerrilla&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script type="text/javascript" src="../js/modo_oscuro.js" defer></script>
    <title>Principal</title>
</head>

<body >
    <!--<h1 id="bienvenida">Bienvenido al sistema</h1> -->
    <header class="header">
        <button id="cambiarTema" class="cambiarTema">
            <img class="iconoPequeno" src="../assets/Blue_darkMode.png" alt="">
            <img class="iconoPequeno" src="../assets/Light_mode.png" alt="">
        </button>
    </header>
    <section class="seccionFondo">
        
        <section id="seccionPrincipal">
            <div class="mensaje" id="msjBienvenida"></div>
            <div id="listaOpciones">
                <button  id="gestionar" class="opcion cambiarTema">
                    <img class="icon" src="../assets/Blue_manage.png" alt="">
                    <img class="icon" src="../assets/Light_manage.png" alt="">
                    Gestionar
                </button>
                <button  id ="opcion_Cuenta" class="opcion cambiarTema">
                    <img src="../assets/Blue_Profile.png"  class = "icon" alt="">
                    <img src="../assets/Light_profile.png"  class="icon">
                    Mi cuenta
                </button>
                <button id="opAyuda" class="opcion cambiarTema">
                    <img src="../assets/Blue_help.png"  class = "icon" alt="">
                    <img src="../assets/Light_help.png" class="icon" alt="">
                    Ayuda
                </button>
                <button id="cerrarSesion"  class="opcion cambiarTema">
                    <img src="../assets/Blue_exit.png"  class = "icon" alt="">
                    <img src="../assets/Light_exit.png" class="icon" alt="">
                    Cerrar sesión
                </button>
            </div> 
            
        </section>
        
    </section>
    <footer class="footer">
        <section id="logoFooter" class="seccionFooter"> <img src="../assets/Blue_bike.png" alt=""></section>

    </footer>
     <script src="../js/script_administrador.js"></script>
</body>

</html>
